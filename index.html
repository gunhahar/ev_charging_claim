<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EV Charging Claim</title>

  <!-- โหลด Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- โหลด React และ ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- โหลด Babel สำหรับแปลง JSX ใน Browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- โหลด SheetJS สำหรับ Export Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
  <!-- จุดที่จะแสดงผลแอปพลิเคชัน -->
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- ส่วนประกอบไอคอน (แทนที่การ import จาก lucide-react) ---
    const Camera = ({ className = "w-5 h-5", ...props }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
    );
    const Upload = ({ className = "w-5 h-5", ...props }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    );
    const Battery = ({ className = "w-5 h-5", ...props }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect x="1" y="6" width="18" height="12" rx="2" ry="2"/><line x1="23" y1="11" x2="23" y2="13"/></svg>
    );
    const Zap = ({ className = "w-5 h-5", ...props }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    );
    const History = ({ className = "w-5 h-5", ...props }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><polyline points="12 7 12 12 15 15"/></svg>
    );
    const LogOut = ({ className = "w-5 h-5", ...props }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    );
    const Plus = ({ className = "w-5 h-5", ...props }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    );
    const Trash2 = ({ className = "w-5 h-5", ...props }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
    );
    const Car = ({ className = "w-5 h-5", ...props }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9L18 10l-3-4H9L6 10l-2.5 1.1C2.7 11.3 2 12.1 2 13v3c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>
    );
    const AlertCircle = ({ className = "w-5 h-5", ...props }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    );
    const ArrowLeft = ({ className = "w-5 h-5", ...props }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    );
    const Download = ({ className = "w-5 h-5", ...props }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    );
    const FileText = ({ className = "w-5 h-5", ...props }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    );

    // --- แอปพลิเคชันหลัก ---
    function App() {
      const MOCK_EMPLOYEES = [
        { empId: '1105291', firstName: 'ทดสอบ', lastName: 'FCP' },
        { empId: '1106357', firstName: 'ธริยา', lastName: 'FCP' }
      ];

      const [employees] = useState(MOCK_EMPLOYEES);
      const [cars, setCars] = useState([
        { id: 'c1', empId: '1105291', licensePlate: '2ขด 1234', brand: 'Toyota', year: '2023', capacity: 40 }
      ]);
      const [logs, setLogs] = useState([]);
      const [bills, setBills] = useState([]);

      const [user, setUser] = useState(null);
      const [view, setView] = useState('LOGIN'); 
      const [selectedCar, setSelectedCar] = useState(null);
      const [dialog, setDialog] = useState(null);

      const [loginId, setLoginId] = useState('');
      const [loginError, setLoginError] = useState('');

      const [carPlate, setCarPlate] = useState('');
      const [carBrand, setCarBrand] = useState('');
      const [carYear, setCarYear] = useState('');
      const [carCapacity, setCarCapacity] = useState('');

      const [date, setDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [currentBattery, setCurrentBattery] = useState('');
      const [elecRate, setElecRate] = useState(0);
      const [photo, setPhoto] = useState(null);
      const [photoPreview, setPhotoPreview] = useState('');
      const [energyNeeded, setEnergyNeeded] = useState(0);
      const [totalCost, setTotalCost] = useState(0);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isExporting, setIsExporting] = useState(null);
      const fileInputRef = useRef(null);

      const [billMonth, setBillMonth] = useState('');
      const [billTotalCost, setBillTotalCost] = useState('');
      const [billTotalUnits, setBillTotalUnits] = useState('');
      const [billPhotoPreview, setBillPhotoPreview] = useState('');
      const billFileInputRef = useRef(null);

      useEffect(() => {
        if (selectedCar && currentBattery !== '') {
          const batt = parseFloat(currentBattery);
          const cap = parseFloat(selectedCar.capacity);

          if (!isNaN(batt) && !isNaN(cap) && batt >= 0 && batt <= 100) {
            const energy = ((100 - batt) / 100) * cap;
            setEnergyNeeded(energy);

            const chargeMonth = date.substring(0, 7);
            const userBill = bills.find(b => b.empId === user?.empId && b.month === chargeMonth);

            if (userBill) {
              const cost = energy * userBill.rate;
              setTotalCost(cost);
              setElecRate(userBill.rate);
            } else {
              let remaining = energy;
              let cost = 0;
              if (remaining > 400) { cost += (remaining - 400) * 4.3583; remaining = 400; }
              if (remaining > 200) { cost += (remaining - 200) * 4.1584; remaining = 200; }
              if (remaining > 0) { cost += remaining * 3.00; }

              setTotalCost(cost);
              setElecRate(energy > 0 ? (cost / energy) : 0);
            }
          } else {
            setEnergyNeeded(0); setTotalCost(0); setElecRate(0);
          }
        } else {
          setEnergyNeeded(0); setTotalCost(0); setElecRate(0);
        }
      }, [currentBattery, selectedCar, date, bills, user]);

      const handleLogin = (e) => {
        e.preventDefault();
        const foundUser = employees.find(emp => emp.empId === loginId.trim().toUpperCase());
        if (foundUser) {
          setUser(foundUser);
          setLoginError('');
          setView('DASHBOARD');
        } else {
          setLoginError('ไม่พบรหัสพนักงานนี้ในระบบ');
        }
      };

      const handleLogout = () => {
        setUser(null); setLoginId(''); setView('LOGIN');
      };

      const handleAddCar = (e) => {
        e.preventDefault();
        const newCar = {
          id: Date.now().toString(),
          empId: user.empId,
          licensePlate: carPlate,
          brand: carBrand,
          year: carYear,
          capacity: parseFloat(carCapacity)
        };
        setCars([...cars, newCar]);
        setCarPlate(''); setCarBrand(''); setCarYear(''); setCarCapacity('');
        setView('DASHBOARD');
      };

      const handleDeleteCar = (carId) => {
        setDialog({
          message: 'คุณต้องการลบข้อมูลรถคันนี้ใช่หรือไม่? (ประวัติการชาร์จของรถคันนี้จะยังคงแสดงอยู่ในส่วนประวัติการชาร์จด้านล่าง)',
          onConfirm: () => setCars(cars.filter(c => c.id !== carId))
        });
      };

      const handleBillPhotoChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setBillPhotoPreview(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleSubmitBill = (e) => {
        e.preventDefault();
        if (!billPhotoPreview || !billMonth || !billTotalCost || !billTotalUnits) return;

        const rate = parseFloat(billTotalCost) / parseFloat(billTotalUnits);
        const newBill = {
          id: Date.now().toString(),
          empId: user.empId,
          month: billMonth,
          totalCost: parseFloat(billTotalCost),
          totalUnits: parseFloat(billTotalUnits),
          rate: rate,
          photoPreview: billPhotoPreview
        };

        setBills([...bills.filter(b => !(b.empId === user.empId && b.month === billMonth)), newBill]);
        setBillMonth(''); setBillTotalCost(''); setBillTotalUnits(''); setBillPhotoPreview('');
        setView('DASHBOARD');
        setDialog({ message: 'บันทึกบิลค่าไฟสำเร็จ!', isAlert: true });
      };

      const handlePhotoChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          setPhoto(file);
          const reader = new FileReader();
          reader.onloadend = () => setPhotoPreview(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleSubmitLog = (e) => {
        e.preventDefault();
        if (!currentBattery || !photoPreview || !selectedCar) return;

        setIsSubmitting(true);
        setTimeout(async () => {
          const newLog = {
            id: Date.now().toString(),
            empId: user.empId,
            carId: selectedCar.id,
            licensePlate: selectedCar.licensePlate,
            date,
            currentBattery: parseFloat(currentBattery),
            energyNeeded: energyNeeded.toFixed(2),
            totalCost: totalCost.toFixed(2),
            elecRate: parseFloat(elecRate),
            photoPreview
          };

          // ==========================================
          // เริ่มต้นส่งข้อมูลเข้า Google Sheets API
          // ==========================================
          const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby7NUeTkKS0PYeoWIt5cx4ZNhCTdm-bHvVdase_v_bdJHEdoRt9EFxFsWywzQKHmH5D3w/exec";

          if (GOOGLE_WEB_APP_URL && GOOGLE_WEB_APP_URL.includes("script.google.com")) {
            try {
              const payload = {
                empId: newLog.empId,
                licensePlate: newLog.licensePlate,
                currentBattery: newLog.currentBattery, // เพิ่มข้อมูลแบตเตอรี่ก่อนชาร์จ
                energyNeeded: newLog.energyNeeded,
                elecRate: newLog.elecRate,             // เพิ่มข้อมูลอัตราค่าไฟต่อหน่วย
                totalCost: newLog.totalCost,
                fileName: `Charge_${newLog.empId}_${newLog.id}.jpg`,
                imageBase64: photoPreview
              };

              await fetch(GOOGLE_WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                  "Content-Type": "text/plain",
                },
                body: JSON.stringify(payload)
              });
              console.log("ส่งข้อมูลเข้า Google Sheets สำเร็จ");
            } catch (error) {
              console.error("เกิดข้อผิดพลาดในการส่งข้อมูลเข้า Google Sheets:", error);
            }
          }
          // ==========================================

          setLogs([...logs, newLog]);
          setIsSubmitting(false);

          setCurrentBattery(''); setPhoto(null); setPhotoPreview('');
          setDate(new Date().toISOString().split('T')[0]);
          setView('DASHBOARD');
          setDialog({ message: 'บันทึกข้อมูลสำเร็จ!', isAlert: true });
        }, 800);
      };

      const handleExportXLSX = async (plate, month, monthLogs) => {
        setIsExporting(month);
        try {
          if (!window.XLSX) {
            await new Promise((resolve, reject) => {
              const script = document.createElement('script');
              script.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
              script.onload = resolve;
              script.onerror = reject;
              document.head.appendChild(script);
            });
          }

          const sortedLogs = [...monthLogs].sort((a, b) => a.date.localeCompare(b.date));
          const exportData = sortedLogs.map((log, index) => ({
            "ลำดับ": index + 1,
            "วันที่ชาร์จ": log.date,
            "รหัสพนักงาน": log.empId,
            "ทะเบียนรถ": log.licensePlate,
            "แบตเตอรี่ก่อนชาร์จ (%)": log.currentBattery,
            "ปริมาณไฟที่ชาร์จเพิ่ม (kWh)": Number(log.energyNeeded),
            "ค่าไฟต่อหน่วย (บาท)": Number(log.elecRate),
            "ยอดเงินเบิก (บาท)": Number(log.totalCost)
          }));

          const worksheet = window.XLSX.utils.json_to_sheet(exportData);
          worksheet['!cols'] = [{ wch: 8 }, { wch: 15 }, { wch: 12 }, { wch: 15 }, { wch: 20 }, { wch: 22 }, { wch: 18 }, { wch: 15 }];
          const workbook = window.XLSX.utils.book_new();
          window.XLSX.utils.book_append_sheet(workbook, worksheet, "ประวัติการชาร์จ");
          window.XLSX.writeFile(workbook, `EV_Charge_${user.empId}_${plate}_${month}.xlsx`);
        } catch (error) {
          console.error("Export Error:", error);
          setDialog({ message: 'เกิดข้อผิดพลาด ไม่สามารถสร้างไฟล์ Excel ได้', isAlert: true });
        } finally {
          setIsExporting(null);
        }
      };

      const Header = ({ title, showBack = true, onBack }) => (
        <header className="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-10 flex items-center justify-between">
          <div className="flex items-center gap-3">
            {showBack && (
              <button onClick={onBack} className="p-1 hover:bg-emerald-700 rounded-full transition-colors">
                <ArrowLeft className="w-5 h-5" />
              </button>
            )}
            <h1 className="text-lg font-bold">{title}</h1>
          </div>
          {!showBack && (
            <button onClick={handleLogout} className="flex items-center gap-1 text-sm bg-emerald-700 px-3 py-1.5 rounded-full hover:bg-emerald-800 transition-colors">
              <LogOut className="w-4 h-4" /> ออกระบบ
            </button>
          )}
        </header>
      );

      const CustomDialog = () => dialog ? (
        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl">
            <div className="flex items-start gap-3 mb-4">
              <div className={`p-2 rounded-full ${dialog.isAlert ? 'bg-emerald-100 text-emerald-600' : 'bg-amber-100 text-amber-600'}`}>
                <AlertCircle className="w-6 h-6" />
              </div>
              <p className="text-slate-800 font-medium pt-1 text-left">{dialog.message}</p>
            </div>
            <div className="flex gap-3 justify-end mt-6">
              {!dialog.isAlert && (
                <button type="button" onClick={() => setDialog(null)} className="px-4 py-2 text-slate-600 font-medium hover:bg-slate-100 rounded-xl transition-colors">
                  ยกเลิก
                </button>
              )}
              <button 
                type="button"
                onClick={() => {
                  if (dialog.onConfirm) dialog.onConfirm();
                  setDialog(null);
                }} 
                className="px-4 py-2 bg-emerald-600 text-white font-medium rounded-xl hover:bg-emerald-700 transition-colors shadow-sm"
              >
                ตกลง
              </button>
            </div>
          </div>
        </div>
      ) : null;

      if (view === 'LOGIN') {
        return (
          <div className="min-h-screen bg-slate-50 flex flex-col justify-center items-center p-4">
            <div className="w-full max-w-md bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center">
              <div className="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <Zap className="w-8 h-8 text-emerald-600 fill-emerald-600" />
              </div>
              <h1 className="text-2xl font-bold text-slate-800 mb-2">EV Charge Claim</h1>
              <p className="text-slate-500 text-sm mb-8">ระบบบันทึกการชาร์จรถไฟฟ้า</p>

              <form onSubmit={handleLogin} className="space-y-4">
                <div className="text-left">
                  <label className="block text-sm font-medium text-slate-700 mb-1">รหัสพนักงาน</label>
                  <input 
                    type="text" 
                    value={loginId}
                    onChange={(e) => setLoginId(e.target.value)}
                    placeholder="กรุณาใส่รหัสพนักงานเพื่อเข้าใช้งาน"
                    className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none uppercase"
                    required
                  />
                </div>
                {loginError && <p className="text-red-500 text-sm text-left">{loginError}</p>}
                <button type="submit" className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-semibold shadow-lg shadow-emerald-600/30 transition-colors">
                  เข้าสู่ระบบ
                </button>
              </form>

              <div className="mt-6 p-4 bg-slate-100/80 border border-slate-200 rounded-xl text-left text-sm text-slate-600">
                <p className="font-semibold text-emerald-800 mb-1">ตัวอย่างสำหรับทดสอบ</p>
                <ul className="space-y-1">
                  <li>- พิมพ์ <span className="font-bold text-slate-700">1105291</span> (มีรถทดสอบ)</li>
                  <li>- พิมพ์ <span className="font-bold text-slate-700">1106357</span> (ยังไม่มีรถ)</li>
                </ul>
              </div>
            </div>
            <CustomDialog />
          </div>
        );
      }

      if (view === 'ADD_CAR') {
        return (
          <div className="min-h-screen bg-slate-50 text-slate-800 pb-10">
            <Header title="ลงทะเบียนรถใหม่" onBack={() => setView('DASHBOARD')} />
            <main className="max-w-md mx-auto p-4 mt-4">
              <form onSubmit={handleAddCar} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">ทะเบียนรถ <span className="text-red-500">*</span></label>
                  <input type="text" value={carPlate} onChange={e => setCarPlate(e.target.value)} required
                    placeholder="เช่น รถ 1234 กทม." className="w-full p-3 border rounded-xl" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">ยี่ห้อ (Brand) <span className="text-red-500">*</span></label>
                  <input type="text" value={carBrand} onChange={e => setCarBrand(e.target.value)} required
                    placeholder="เช่น BYD, Tesla, MG" className="w-full p-3 border rounded-xl" />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">รุ่น / ปีรถ</label>
                    <input type="text" value={carYear} onChange={e => setCarYear(e.target.value)} 
                      placeholder="เช่น Dolphin 2023" className="w-full p-3 border rounded-xl" />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">ความจุแบตฯ (kWh) <span className="text-red-500">*</span></label>
                    <input type="number" step="0.1" value={carCapacity} onChange={e => setCarCapacity(e.target.value)} required
                      placeholder="เช่น 39.4" className="w-full p-3 border rounded-xl" />
                  </div>
                </div>
                <button type="submit" className="w-full py-3.5 bg-emerald-600 text-white rounded-xl font-bold mt-2">
                  บันทึกข้อมูลรถ
                </button>
              </form>
            </main>
            <CustomDialog />
          </div>
        );
      }

      if (view === 'ADD_BILL') {
        return (
          <div className="min-h-screen bg-slate-50 text-slate-800 pb-10">
            <Header title="อัพโหลดบิลค่าไฟ" onBack={() => setView('DASHBOARD')} />
            <main className="max-w-md mx-auto p-4 mt-4">
              <form onSubmit={handleSubmitBill} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">เดือนที่ของบิล <span className="text-red-500">*</span></label>
                  <input type="month" value={billMonth} onChange={e => setBillMonth(e.target.value)} required
                    className="w-full p-3 bg-slate-50 border rounded-xl" />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">ยอดรวมสุทธิ (฿) <span className="text-red-500">*</span></label>
                    <input type="number" step="0.01" min="0" value={billTotalCost} onChange={e => setBillTotalCost(e.target.value)} required
                      placeholder="เช่น 1500.50" className="w-full p-3 bg-slate-50 border rounded-xl" />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">จำนวนหน่วย <span className="text-red-500">*</span></label>
                    <input type="number" step="0.1" min="0.1" value={billTotalUnits} onChange={e => setBillTotalUnits(e.target.value)} required
                      placeholder="เช่น 350" className="w-full p-3 bg-slate-50 border rounded-xl" />
                  </div>
                </div>

                {billTotalCost && billTotalUnits && (
                  <div className="bg-emerald-50 p-3 rounded-xl border border-emerald-100 flex justify-between items-center">
                    <span className="text-sm text-emerald-800">ค่าไฟเฉลี่ย:</span>
                    <span className="font-bold text-emerald-700">{(parseFloat(billTotalCost) / parseFloat(billTotalUnits)).toFixed(4)} บาท/หน่วย</span>
                  </div>
                )}

                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-2">รูปถ่ายบิลค่าไฟ <span className="text-red-500">*</span></label>
                  <input type="file" accept="image/*" className="hidden" ref={billFileInputRef} onChange={handleBillPhotoChange} />
                  {!billPhotoPreview ? (
                    <button type="button" onClick={() => billFileInputRef.current?.click()}
                      className="w-full border-2 border-dashed border-slate-300 rounded-xl p-8 flex flex-col items-center justify-center text-slate-500 bg-slate-50">
                      <Camera className="w-6 h-6 mb-2 text-emerald-600" />
                      <span className="font-medium text-sm">แตะเพื่อถ่ายรูปบิล</span>
                    </button>
                  ) : (
                    <div className="relative rounded-xl overflow-hidden border">
                      <img src={billPhotoPreview} alt="Bill Preview" className="w-full h-48 object-cover" />
                      <button type="button" onClick={() => setBillPhotoPreview('')}
                        className="absolute top-2 right-2 bg-slate-900/70 text-white text-xs px-3 py-1.5 rounded-lg">ถ่ายใหม่</button>
                    </div>
                  )}
                </div>

                <button type="submit" disabled={!billPhotoPreview}
                  className="w-full py-3.5 bg-emerald-600 text-white rounded-xl font-bold mt-2 disabled:bg-slate-300">
                  บันทึกบิลค่าไฟ
                </button>
              </form>
            </main>
            <CustomDialog />
          </div>
        );
      }

      if (view === 'ADD_LOG') {
        return (
          <div className="min-h-screen bg-slate-50 text-slate-800 pb-10">
            <Header title="บันทึกการชาร์จ" onBack={() => setView('DASHBOARD')} />
            <main className="max-w-md mx-auto p-4 mt-4">
              <form onSubmit={handleSubmitLog} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="p-4 bg-emerald-50 border-b border-emerald-100 flex items-center justify-between">
                  <div>
                    <p className="text-xs text-emerald-600 font-semibold mb-0.5">กำลังบันทึกของรถ:</p>
                    <p className="font-bold text-slate-800">{selectedCar?.licensePlate}</p>
                  </div>
                  <div className="text-right">
                    <p className="text-xs text-slate-500">ความจุแบตฯ</p>
                    <p className="font-semibold text-slate-700">{selectedCar?.capacity} kWh</p>
                  </div>
                </div>

                <div className="p-5 space-y-4">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-medium text-slate-500 mb-1">วันที่ชาร์จ</label>
                      <input type="date" value={date} onChange={(e) => setDate(e.target.value)} required
                        className="w-full p-2.5 bg-slate-50 border rounded-lg text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-slate-500 mb-1">ค่าไฟต่อหน่วย (บ.)</label>
                      <div className="w-full p-1.5 bg-slate-100 border border-slate-200 rounded-lg text-sm flex flex-col justify-center min-h-[42px]">
                        <span className="font-semibold text-slate-700 leading-none">{Number(elecRate).toFixed(4)}</span>
                        <span className="text-[10px] text-slate-500 leading-none mt-1">
                          {bills.find(b => b.empId === user?.empId && b.month === date.substring(0, 7))
                            ? 'ตามบิลเดือนนี้'
                            : 'เรทขั้นบันได (ไม่มีบิล)'}
                        </span>
                      </div>
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">
                      แบตเตอรี่ที่เหลือ (%) ก่อนชาร์จ <span className="text-red-500">*</span>
                    </label>
                    <div className="relative">
                      <input type="number" min="0" max="100" value={currentBattery} onChange={(e) => setCurrentBattery(e.target.value)} required
                        placeholder="เช่น 33" className="w-full p-3 pr-12 text-lg font-bold border-2 rounded-xl focus:border-emerald-500 outline-none" />
                      <Battery className="w-6 h-6 text-slate-400 absolute right-4 top-3.5" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-2">รูปถ่ายหน้าปัดรถ <span className="text-red-500">*</span></label>
                    <input type="file" accept="image/*" capture="environment" className="hidden" ref={fileInputRef} onChange={handlePhotoChange} />
                    {!photoPreview ? (
                      <button type="button" onClick={() => fileInputRef.current?.click()}
                        className="w-full border-2 border-dashed border-slate-300 rounded-xl p-8 flex flex-col items-center justify-center text-slate-500 bg-slate-50">
                        <Camera className="w-6 h-6 mb-2 text-emerald-600" />
                        <span className="font-medium text-sm">แตะเพื่อถ่ายรูปหน้าปัด</span>
                      </button>
                    ) : (
                      <div className="relative rounded-xl overflow-hidden border">
                        <img src={photoPreview} alt="Preview" className="w-full h-48 object-cover" />
                        <button type="button" onClick={() => setPhotoPreview('')}
                          className="absolute top-2 right-2 bg-slate-900/70 text-white text-xs px-3 py-1.5 rounded-lg">ถ่ายใหม่</button>
                      </div>
                    )}
                  </div>

                  <div className="bg-emerald-50 rounded-xl p-4 border border-emerald-100">
                    <div className="flex justify-between items-center mb-1">
                      <span className="text-sm text-slate-600">ปริมาณไฟที่ชาร์จเพิ่ม:</span>
                      <span className="font-semibold text-slate-800">{energyNeeded.toFixed(2)} kWh</span>
                    </div>
                    <div className="flex justify-between items-center mt-2 pt-2 border-t border-emerald-200">
                      <span className="font-medium text-emerald-900">ยอดเงินประเมิน:</span>
                      <span className="text-2xl font-bold text-emerald-700">{totalCost.toFixed(2)} ฿</span>
                    </div>
                  </div>

                  <button type="submit" disabled={isSubmitting || !currentBattery || !photoPreview}
                    className="w-full py-3.5 bg-emerald-600 text-white rounded-xl font-bold disabled:bg-slate-300 flex items-center justify-center gap-2">
                    {isSubmitting ? (
                      <span>กำลังบันทึก...</span>
                    ) : (
                      <span className="flex items-center gap-2">
                        <Upload className="w-5 h-5"/> บันทึกการชาร์จ
                      </span>
                    )}
                  </button>
                </div>
              </form>
            </main>
            <CustomDialog />
          </div>
        );
      }

      const myCars = cars.filter(c => c.empId === user?.empId);
      const myLogs = logs.filter(l => l.empId === user?.empId);
      const myBills = bills.filter(b => b.empId === user?.empId).sort((a,b) => b.month.localeCompare(a.month));

      const groupedLogs = myLogs.reduce((acc, log) => {
        const month = log.date.substring(0, 7);
        if (!acc[log.licensePlate]) acc[log.licensePlate] = {};
        if (!acc[log.licensePlate][month]) acc[log.licensePlate][month] = [];
        acc[log.licensePlate][month].push(log);
        return acc;
      }, {});

      const formatMonth = (monthStr) => {
        if (!monthStr || typeof monthStr !== 'string') return '';
        const parts = monthStr.split('-');
        if (parts.length < 2) return monthStr;
        const year = parts[0];
        const monthIdx = parseInt(parts[1], 10) - 1;
        const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
        return `${months[monthIdx]} ${year}`;
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 pb-10">
          <Header title="หน้าหลัก (Dashboard)" showBack={false} />

          <main className="max-w-md mx-auto p-4 space-y-6 mt-2">
            <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-4">
              <div className="flex items-center gap-4">
                <div className="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-xl font-bold">
                  {user?.firstName[0]}
                </div>
                <div>
                  <p className="text-sm text-slate-500">ยินดีต้อนรับ</p>
                  <p className="font-bold text-lg">{user?.firstName} {user?.lastName}</p>
                  <p className="text-xs bg-slate-100 inline-block px-2 py-0.5 rounded text-slate-600 mt-1">รหัส: {user?.empId}</p>
                </div>
              </div>
            </div>

            <section>
              <div className="flex justify-between items-end mb-3">
                <h2 className="text-sm font-bold text-slate-700 flex items-center gap-2">
                  <Car className="w-5 h-5 text-emerald-600" />
                  รถประจำตัวของท่าน ({myCars.length})
                </h2>
              </div>

              <div className="space-y-3">
                {myCars.length === 0 ? (
                  <div className="bg-white border-2 border-dashed border-slate-300 rounded-2xl p-6 text-center">
                    <AlertCircle className="w-8 h-8 text-slate-400 mx-auto mb-2" />
                    <p className="text-sm text-slate-500 mb-3">คุณยังไม่ได้ลงทะเบียนรถที่ใช้งาน</p>
                    <button onClick={() => setView('ADD_CAR')} className="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-emerald-700">
                      + ลงทะเบียนรถคันแรก
                    </button>
                  </div>
                ) : (
                  myCars.map(car => (
                    <div key={car.id} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                      <div className="p-4 flex justify-between items-start">
                        <div>
                          <div className="text-lg font-bold text-slate-800 mb-1">{car.licensePlate}</div>
                          <div className="text-sm text-slate-500">{car.brand} {car.year && `(${car.year})`}</div>
                          <div className="text-xs text-emerald-600 bg-emerald-50 inline-block px-2 py-1 rounded mt-2 font-medium">
                            แบตฯ {car.capacity} kWh
                          </div>
                        </div>
                        <button onClick={() => handleDeleteCar(car.id)} className="text-slate-400 hover:text-red-500 p-1">
                          <Trash2 className="w-4 h-4" />
                        </button>
                      </div>
                      <div className="bg-slate-50 p-3 border-t border-slate-100">
                        <button 
                          onClick={() => { setSelectedCar(car); setView('ADD_LOG'); }}
                          className="w-full py-2.5 bg-emerald-600 text-white rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-emerald-700 shadow-sm"
                        >
                          <Zap className="w-4 h-4" /> บันทึกการชาร์จรถคันนี้
                        </button>
                      </div>
                    </div>
                  ))
                )}

                {myCars.length > 0 && (
                  <button onClick={() => setView('ADD_CAR')} className="w-full py-3 border-2 border-dashed border-emerald-300 text-emerald-700 rounded-xl font-semibold flex items-center justify-center gap-2 hover:bg-emerald-50">
                    <Plus className="w-5 h-5" /> เพิ่มรถคันอื่น
                  </button>
                )}
              </div>
            </section>

            <section>
              <div className="flex justify-between items-end mb-3">
                <h2 className="text-sm font-bold text-slate-700 flex items-center gap-2">
                  <FileText className="w-5 h-5 text-emerald-600" />
                  บิลค่าไฟรายเดือน ({myBills.length})
                </h2>
              </div>

              <div className="space-y-3">
                {myBills.map(bill => (
                  <div key={bill.id} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                    <div>
                      <p className="font-bold text-slate-800">บิลเดือน {formatMonth(bill.month)}</p>
                      <p className="text-xs text-slate-500 mt-1">ใช้ไป {bill.totalUnits} หน่วย | รวม {bill.totalCost} ฿</p>
                    </div>
                    <div className="text-right">
                      <p className="text-sm font-bold text-emerald-600">{bill.rate.toFixed(4)}</p>
                      <p className="text-[10px] text-slate-500">บาท/หน่วย</p>
                    </div>
                  </div>
                ))}
                <button onClick={() => setView('ADD_BILL')} className="w-full py-3 border-2 border-dashed border-emerald-300 text-emerald-700 rounded-xl font-semibold flex items-center justify-center gap-2 hover:bg-emerald-50">
                  <Plus className="w-5 h-5" /> อัพโหลดบิลค่าไฟ
                </button>
              </div>
            </section>

            <section>
              <h2 className="text-sm font-bold text-slate-700 flex items-center gap-2 mb-3">
                <History className="w-5 h-5 text-emerald-600" />
                ประวัติการชาร์จของคุณ
              </h2>

              {Object.keys(groupedLogs).length === 0 ? (
                <p className="text-center text-sm text-slate-400 py-6 bg-white rounded-xl border border-slate-200">ยังไม่มีประวัติการชาร์จ</p>
              ) : (
                <div className="space-y-4">
                  {Object.entries(groupedLogs).map(([plate, months]) => (
                    <div key={plate} className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                      <div className="bg-slate-100 px-4 py-2 font-bold text-sm text-slate-700 border-b border-slate-200">
                        ทะเบียน: {plate}
                      </div>

                      {Object.entries(months).sort((a,b) => b[0].localeCompare(a[0])).map(([month, monthLogs]) => {
                        const totalMonthCost = monthLogs.reduce((sum, log) => sum + parseFloat(log.totalCost), 0);
                        return (
                          <div key={month} className="border-b border-slate-100 last:border-0">
                            <div className="px-4 py-2 bg-slate-50 flex justify-between items-center">
                              <span className="text-sm font-semibold text-slate-600">{formatMonth(month)}</span>
                              <div className="flex items-center gap-3">
                                <span className="text-sm font-bold text-emerald-600">รวม {totalMonthCost.toFixed(2)} ฿</span>
                                <button 
                                  onClick={() => handleExportXLSX(plate, month, monthLogs)}
                                  disabled={isExporting === month}
                                  className="flex items-center gap-1 text-xs bg-white border border-emerald-200 text-emerald-600 px-2 py-1 rounded hover:bg-emerald-50 transition-colors disabled:opacity-50"
                                  title="ดาวน์โหลดเป็นไฟล์ Excel"
                                >
                                  <Download className="w-3 h-3" />
                                  {isExporting === month ? '...' : 'Export'}
                                </button>
                              </div>
                            </div>
                            <div className="divide-y divide-slate-100">
                              {monthLogs.sort((a,b) => b.date.localeCompare(a.date)).map(log => (
                                <div key={log.id} className="p-3 px-4 flex gap-3 items-center hover:bg-slate-50">
                                  <img src={log.photoPreview} alt="dash" className="w-12 h-12 rounded object-cover border border-slate-200" />
                                  <div className="flex-1">
                                    <div className="flex justify-between">
                                      <span className="text-xs text-slate-500">{log.date}</span>
                                      <span className="text-sm font-semibold text-slate-700">{log.totalCost} ฿</span>
                                    </div>
                                    <div className="text-xs text-slate-500 mt-1">
                                      แบตฯ ก่อนชาร์จ <span className="font-medium text-slate-700">{log.currentBattery}%</span> • ชาร์จเพิ่ม {log.energyNeeded} kWh
                                    </div>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        )
                      })}
                    </div>
                  ))}
                </div>
              )}
            </section>
          </main>
          <CustomDialog />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
